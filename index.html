<title>DEMO · Eleições Grêmio · Escola Antônio Sylvio da Cunha Bueno</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--navy:#0b1d4a;--orange:#f08a1c;--gold:#ffc93c;--paper:#fffaf0;--ink:#12204a;--mut:#5d6a8c;--ok:#12a150;--err:#d93a30;--bd:#e6dfcf;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;color:#fff;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 420px at 50% -80px,#2a55c2,transparent 70%),var(--navy)}
main{max-width:540px;margin:0 auto;padding:18px 16px 48px}
.hero{display:flex;align-items:center;gap:16px;margin:6px 0 18px}
.logo{flex:none;width:92px;height:92px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--gold),var(--orange));animation:glow 3s ease-in-out infinite}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,201,60,.18)}}
h1{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;font-size:28px;line-height:1.05;margin:0}
h2{font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;margin:0 0 6px;font-size:24px}
.esc{color:var(--gold);font-weight:700;font-size:14px;margin-top:6px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px}
.steps li{flex:1;text-align:center;font-size:13px;font-weight:800;padding:8px 0;border-radius:99px;background:rgba(255,255,255,.1);color:#a9b8e6;transition:.3s}
.steps li.on{background:var(--gold);color:var(--navy)}.steps li.done{background:rgba(255,201,60,.35);color:#fff}
.view{animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px;margin-bottom:14px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.center{text-align:center}.sub{color:var(--mut);margin:0 0 12px;font-size:14px}.light{color:#c9d4f5;margin:0 0 14px}
label{display:block;font-weight:800;margin-bottom:10px;font-size:18px}
input{width:100%;font:800 28px Nunito,sans-serif;text-align:center;letter-spacing:3px;padding:16px;border-radius:14px;border:3px solid var(--bd);background:#fff;color:var(--ink);transition:.2s}
input:focus{outline:none;border-color:var(--orange)}input.full{border-color:var(--ok)}
.count{text-align:center;color:var(--mut);font-size:13px;margin-top:8px;font-weight:700}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:15px 18px;font-weight:800;transition:transform .15s,opacity .2s}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pri{width:100%;margin-top:14px;font-size:17px;color:var(--navy);background:linear-gradient(135deg,var(--gold),var(--orange));box-shadow:0 8px 20px rgba(240,138,28,.35)}
.pri:hover:not(:disabled){transform:translateY(-2px)}.pri:disabled{opacity:.45;cursor:default;box-shadow:none}
.ghost{width:100%;margin-top:8px;background:transparent;color:#c9d4f5;border:1px solid rgba(255,255,255,.3)}
.card .ghost{color:var(--mut);border-color:var(--bd)}
.msg{margin-top:10px;font-weight:800;color:var(--err);text-align:center}
.cand{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:3px solid transparent;margin-bottom:10px;padding:12px;animation:in .4s both}
.cand:hover{transform:translateY(-3px)}
.cand.sel{border-color:var(--orange);transform:scale(1.02);background:#fff3da}
.num{flex:none;min-width:62px;height:62px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 28px "Baloo 2",sans-serif}
.cand img{width:62px;height:62px;border-radius:16px;object-fit:cover}
.txt{flex:1}.nm{font-weight:800;font-size:17px}.sl{font-size:13px;color:var(--mut)}
.tick{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.cand.sel .tick{transform:scale(1)}
.sticky{position:sticky;bottom:12px}
.chk{width:96px;height:96px}.chk circle{fill:none;stroke:var(--ok);stroke-width:6;stroke-dasharray:290;stroke-dashoffset:290;animation:dr .6s .1s forwards}
.chk path{fill:none;stroke:var(--ok);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .4s .6s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.cb{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:14px 0 6px}.cb i{display:block;height:100%;background:var(--orange);width:100%;transition:width 5s linear}
.pill{display:inline-block;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:#e6ebf7;color:var(--mut);margin-bottom:12px}
.pill.aberta{background:#d9f5e5;color:var(--ok)}.pill.aberta::before{content:"● ";animation:bl 1.2s infinite}.pill.encerrada{background:#fde1df;color:var(--err)}
@keyframes bl{50%{opacity:.2}}
.top{display:flex;align-items:center;gap:18px}.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:11}.ring .bg{stroke:var(--bd)}
.ring .fg{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.rt b{font:800 26px "Baloo 2",sans-serif}.rt span{font-size:11px;color:var(--mut)}
.big{font:800 28px "Baloo 2",sans-serif;line-height:1.1}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-top:10px}
.bar{height:12px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--c,var(--orange));border-radius:6px;transition:width .9s ease}
.win{border:3px solid var(--gold);background:#fff6dc;border-radius:16px;padding:12px;margin-top:10px}.res{padding:4px 0}
.demo{background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.3);border-radius:16px;padding:14px;margin-top:24px;color:#c9d4f5;font-size:13px}
.tag{background:var(--gold);color:var(--navy);font-weight:800;font-size:12px;text-align:center;padding:6px 10px;border-radius:99px;margin-bottom:12px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh}
main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sticky{padding-top:10px;background:linear-gradient(rgba(11,29,74,0),var(--navy) 40%)}
@media (max-width:480px){
main{padding-top:10px;padding-bottom:40px}
.hero{gap:12px;margin-bottom:14px}
.logo{width:72px;height:72px}
h1{font-size:23px}h2{font-size:21px}.esc{font-size:12.5px;margin-top:4px}
.steps{margin-bottom:14px}.steps li{font-size:12px;padding:7px 0}
.card{padding:18px;border-radius:18px}
input{font-size:24px;padding:14px;letter-spacing:2px}
.cand{gap:12px;padding:10px}
.num,.cand img{min-width:52px;width:52px;height:52px;font-size:24px;border-radius:14px}
.nm{font-size:16px}.pri{font-size:16px;padding:16px}
.top{flex-direction:column;text-align:center;gap:10px}
.big{font-size:25px}
}
@media (max-width:360px){
.hero{flex-direction:column;text-align:center}
.steps li{font-size:11px}
h1{font-size:21px}
}
@media (min-width:768px){
main{max-width:620px;padding-top:40px}
.hero{gap:22px;margin-bottom:26px}
.logo{width:116px;height:116px}
h1{font-size:36px}.esc{font-size:16px}
.card{padding:28px}
}
@media (max-height:480px) and (orientation:landscape){
.hero{margin:0 0 10px}.logo{width:60px;height:60px}h1{font-size:20px}.steps{margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const sb={
  from:()=>({select:()=>({order:async()=>({data:CANDS})})}),
  async rpc(fn,a){
    let estado=DB.get("estado","aberta"),usados=DB.get("usados",[]),votos=DB.get("votos",{});
    if(fn==="estado_votacao")return{data:estado};
    if(fn==="verificar_ra"){const r=norm(a.p_ra);if(estado!=="aberta")return{data:"fechada"};if(r==="9999999999")return{data:"ra_invalido"};return{data:usados.includes(r)?"ja_votou":"ok"}}
    if(fn==="votar"){const r=norm(a.p_ra);if(estado!=="aberta")return{data:"fechada"};if(usados.includes(r))return{data:"ja_votou"};
      usados.push(r);votos[a.p_candidato]=(votos[a.p_candidato]||0)+1;DB.set("usados",usados);DB.set("votos",votos);return{data:"ok"}}
    if(a.p_senha!=="admin")return{error:{message:"senha"}};
    if(fn==="definir_estado"){DB.set("estado",a.p_estado);return{data:null}}
    if(fn==="painel"){
      const turmas=TURMAS.map(t=>({turma:t,total:100,votaram:usados.filter(r=>turmaDe(r)===t).length}));
      return{data:{estado,total:500,votaram:usados.length,turmas,
        resultado:estado==="encerrada"?CANDS.map(c=>({numero:c.numero,nome:c.nome,votos:votos[c.id]||0})).sort((x,y)=>y.votos-x.votos):null}};
    }
  }
};
function demoReset(){["estado","usados","votos"].forEach(k=>localStorage.removeItem("demo_"+k));location.hash="";inicio()}
function demoSim(){let u=DB.get("usados",[]),v=DB.get("votos",{});for(let i=0;i<300;i++){u.push("SIM"+Math.random().toString(36).slice(2,9).toUpperCase());const c=Math.random()<.45?1:Math.random()<.55?2:3;v[c]=(v[c]||0)+1}DB.set("usados",u);DB.set("votos",v);document.getElementById("simbtn").textContent="✔ 300 votos simulados (abra o painel)"}

const $app=document.getElementById("app"),$st=document.getElementById("steps");
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const show=(...n)=>{const v=h("div","view");v.append(...n);$app.replaceChildren(v)};
const step=n=>{$st.hidden=n<0;[...$st.children].forEach((li,k)=>li.className=k<n?"done":k===n?"on":"")};
const normRA=s=>s.replace(/\D/g,"").replace(/^0+/,"");
const COR=["#1f4bd1","#e8590c","#0a9c6b","#8e3fd1","#d6336c"];
const MSG={ra_invalido:"RA não encontrado. Confira os números ou procure a coordenação.",ja_votou:"Este RA já votou. Não é possível votar duas vezes.",fechada:"A votação não está aberta no momento.",candidato_invalido:"Candidato inválido. Recarregue a página."};
let ra="",cands=[],timer=null,celebrou=false;const last={};

function confetti(){const c=document.createElement("canvas");c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext("2d");if(!x){c.remove();return}
 const P=Array.from({length:140},()=>({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:Math.random()*8+4,r:Math.random()*6,k:["#ffc93c","#f08a1c","#1f4bd1","#12a150","#fff"][Math.random()*5|0]}));
 const t0=performance.now();(function f(n){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.k;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
 if(n-t0<2600)requestAnimationFrame(f);else c.remove()})(t0)}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.start();o.stop(a.currentTime+.7)}catch(e){}}

async function inicio(aviso){
 clearInterval(timer);
 if(location.hash==="#painel")return painel();
 step(0);
 const {data:estado}=await sb.rpc("estado_votacao");
 const card=h("section","card");
 if(estado!=="aberta"){step(-1);card.append(h("h2",null,estado==="encerrada"?"Votação encerrada":"A votação ainda não começou"),h("p","sub","Aguarde a orientação do professor."));return show(card)}
 const l=h("label",null,"Digite o seu RA");l.htmlFor="ra";
 const i=h("input");i.id="ra";i.autocomplete="off";i.inputMode="numeric";i.placeholder="1144289221";
 const c=h("div","count","0 de 10 números"),m=h("div","msg",aviso||""),b=h("button","pri","Continuar");
 i.oninput=()=>{const n=normRA(i.value);c.textContent=n.length+" de 10 números";i.classList.toggle("full",n.length===10);m.textContent=""};
 const go=async()=>{
  const n=normRA(i.value);
  if(n.length!==10){m.textContent="O RA deve ter 10 números (sem zeros à esquerda e sem letras).";return}
  b.disabled=true;m.textContent="";
  const {data:r,error}=await sb.rpc("verificar_ra",{p_ra:n});b.disabled=false;
  if(error){m.textContent="Sem conexão. Tente novamente.";return}
  if(r!=="ok"){m.textContent=MSG[r]||"Erro inesperado.";return}
  ra=n;urna()};
 b.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};
 card.append(l,i,c,m,b);show(card);i.focus()}

async function urna(){
 step(1);
 if(!cands.length){const {data}=await sb.from("candidatos").select("*").order("numero");cands=data||[]}
 let sel=null;
 const box=h("div"),b=h("button","pri","Escolha um candidato");b.disabled=true;
 cands.forEach((c,k)=>{
  const x=h("button","cand");x.style.setProperty("--c",COR[k%COR.length]);x.style.animationDelay=k*80+"ms";
  let f;if(c.foto_url){f=h("img");f.src=c.foto_url;f.alt=""}else f=h("div","num",c.numero);
  const t=h("div","txt");t.append(h("div","nm",c.nome));if(c.descricao)t.append(h("div","sl",c.descricao));
  x.append(f,t,h("div","tick","✓"));
  x.onclick=()=>{sel=c;[...box.children].forEach(k=>k.classList.remove("sel"));x.classList.add("sel");b.disabled=false;b.textContent="Confirmar voto em "+c.nome};
  box.append(x)});
 b.onclick=async()=>{b.disabled=true;
  const {data:r,error}=await sb.rpc("votar",{p_ra:ra,p_candidato:sel.id});
  if(error){b.disabled=false;b.textContent="Falha de conexão. Tentar de novo";return}
  ra="";if(r!=="ok")return inicio(MSG[r]||"Erro inesperado.");fim()};
 const s=h("div","sticky");s.append(b);
 const v=h("button","ghost","Voltar");v.onclick=()=>inicio();
 show(h("h2",null,"Escolha o seu candidato"),h("p","light","O seu voto é secreto: ninguém vê em quem você votou."),box,s,v)}

function fim(){
 step(2);confetti();beep();
 const card=h("section","card center");
 const svg=h("div");svg.innerHTML='<svg class="chk" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M30 52l14 14 27-30"/></svg>';
 const cb=h("div","cb"),f=h("i");cb.append(f);
 const t=h("div","sub","Próximo aluno em 5s"),b=h("button","pri","Próximo aluno agora");
 card.append(svg,h("h2",null,"Voto registrado!"),h("p","sub","Obrigado por participar da eleição."),cb,t,b);show(card);
 requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width="0%"));
 let n=5;const iv=setInterval(()=>{n--;t.textContent="Próximo aluno em "+n+"s";if(n<=0){clearInterval(iv);inicio()}},1000);
 b.onclick=()=>{clearInterval(iv);inicio()}}

function anim(key,to,fn){const from=last[key]??0;last[key]=to;const t0=performance.now();
 (function tk(now){const p=Math.min(1,(now-t0)/800);fn(Math.round(from+(to-from)*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(tk)})(t0)}
function barra(key,pc,cor){const b=h("div","bar"),f=h("i");if(cor)b.style.setProperty("--c",cor);f.style.width=(last["b"+key]??0)+"%";b.append(f);last["b"+key]=pc;
 requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width=pc+"%"));return b}

function painel(){
 step(-1);
 let senha="",confirmando=false,seq=0;
 const i=h("input");i.type="password";i.placeholder="Senha da direção";i.style.letterSpacing="0";i.style.fontSize="20px";
 const m=h("div","msg"),b=h("button","pri","Entrar"),card=h("section","card");
 card.append(h("h2",null,"Painel da direção"),i,m,b);show(card);i.focus();
 const chamar=(fn,a)=>sb.rpc(fn,{p_senha:senha,...a});
 const carregar=async()=>{const my=++seq;const {data,error}=await chamar("painel",{});if(my!==seq)return;
  if(error){if(/senha/i.test(error.message||"")){clearInterval(timer);senha="";return inicio("Senha incorreta.")}m.textContent="Sem conexão. Tentando de novo...";return}
  desenhar(data)};
 function desenhar(d){
  const pc=d.total?Math.round(d.votaram/d.total*100):0,c=h("section","card");
  c.append(h("div","pill "+d.estado,{aguardando:"Aguardando abertura",aberta:"Votação aberta",encerrada:"Votação encerrada"}[d.estado]));
  const top=h("div","top"),ring=h("div","ring"),from=last.pc??0;
  ring.innerHTML='<svg viewBox="0 0 120 120" width="118" height="118"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="'+(326.7*(1-from/100))+'"/></svg><div class="rt"><b></b><span>participação</span></div>';
  const fg=ring.querySelector(".fg"),nb=ring.querySelector("b");anim("pc",pc,v=>nb.textContent=v+"%");
  requestAnimationFrame(()=>requestAnimationFrame(()=>fg.style.strokeDashoffset=326.7*(1-pc/100)));
  const info=h("div"),big=h("div","big");anim("v",d.votaram,v=>big.textContent=v+" de "+d.total);
  info.append(big,h("div","sub","alunos já votaram"));top.append(ring,info);c.append(top);
  (d.turmas||[]).forEach(t=>{const p=t.total?Math.round(t.votaram/t.total*100):0,r=h("div","row");r.append(h("span",null,t.turma||"Sem turma"),h("span",null,t.votaram+"/"+t.total));c.append(r,barra("t"+t.turma,p))});
  const ac=h("div");
  if(d.estado==="aguardando")ac.append(btn("Abrir votação","aberta"));
  if(d.estado==="aberta"&&!confirmando){const e=h("button","pri","Encerrar votação e ver resultado");e.onclick=()=>{confirmando=true;desenhar(d)};ac.append(e)}
  if(d.estado==="aberta"&&confirmando){ac.append(h("p","msg","Encerrar a votação? Ninguém mais poderá votar."),btn("Sim, encerrar agora","encerrada"));const n=h("button","ghost","Cancelar");n.onclick=()=>{confirmando=false;desenhar(d)};ac.append(n)}
  c.append(ac);const out=[c];
  if(d.resultado){const r=h("section","card");r.append(h("h2",null,"Resultado final"));
   const tot=d.resultado.reduce((a,x)=>a+Number(x.votos),0);
   d.resultado.forEach((x,k)=>{const p=tot?Math.round(x.votos/tot*100):0,w=h("div",k===0&&x.votos>0?"win":"res"),l=h("div","row"),vt=h("b");
    l.append(h("span",null,(k===0&&x.votos>0?"🏆 ":"")+x.numero+" · "+x.nome),vt);anim("r"+x.numero,Number(x.votos),v=>vt.textContent=v+" voto"+(v===1?"":"s")+" ("+p+"%)");
    w.append(l,barra("r"+x.numero,p,COR[k%COR.length]));r.append(w)});
   out.push(r);if(!celebrou){celebrou=true;confetti()}}
  show(...out)}
 function btn(txt,estado){const x=h("button","pri",txt);x.onclick=async()=>{x.disabled=true;confirmando=false;await chamar("definir_estado",{p_estado:estado});carregar()};return x}
 b.onclick=async()=>{senha=i.value;clearInterval(timer);await carregar();timer=setInterval(carregar,10000)};
 i.onkeydown=e=>{if(e.key==="Enter")b.click()}}

window.addEventListener("hashchange",()=>inicio());
inicio();
</script>
</body>
</html>
